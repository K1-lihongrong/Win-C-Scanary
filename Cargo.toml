[workspace]
resolver = "2"
members = [
  "crates/scanner",
  "crates/scaffold",
  "crates/guard",
  "crates/executor",
  "crates/report",
  "crates/cli",
  "crates/dedup",
  "crates/inventory",
  "crates/growth",
]

[workspace.package]
edition    = "2021"
license    = "MIT"
repository = "https://github.com/K1-lihongrong/Win-C-Scanary"
version    = "0.1.1"

[workspace.dependencies]
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
toml         = "0.8"
anyhow      = "1"
thiserror    = "2"
tracing      = "0.1"
tracing-subscriber = "0.3"
walkdir      = "2.5"
jwalk        = "0.8"
rayon        = "1.10"
globset      = "0.4"
trash        = "5"
chrono       = { version = "0.4", features = ["serde"] }
dirs         = "5"
shellexpand  = "3"
clap         = { version = "4", features = ["derive", "env"] }
ntfs         = "0.4"
tiny_http    = "0.12"
windows-sys  = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[profile.release]
opt-level = 3
lto       = "thin"
strip     = true
